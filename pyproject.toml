[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-factor-rd"
version = "0.1.0"
description = "Expert PV time-series factor research with a fixed pooled TabM runtime"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["adapters*", "factor_library*", "runtime*", "scripts*"]
namespaces = true

[tool.setuptools.dynamic]
dependencies = {file = ["runtime/requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests", "runtime/tests"]
pythonpath = ["."]
