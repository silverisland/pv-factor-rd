name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: runtime/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r runtime/requirements-dev.txt
      - name: Validate factor catalog and schemas
        run: python scripts/validate_catalog.py
      - name: Run dependency-light workflow tests
        run: python -m unittest discover -s tests -v
      - name: Run runtime integration tests
        run: python -m pytest runtime/tests -q
      - name: Run bundled TabM demo
        run: python test_demo.py --report-dir "${{ runner.temp }}/pv-factor-rd-demo"
      - name: Run paired factor TabM demo
        run: >-
          python test_demo.py
          --factor factor.weather.future-change
          --factor factor.weather.clear-sky-index-forecast
          --report-dir "${{ runner.temp }}/pv-factor-rd-factor-demo"
